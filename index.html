<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Bíblico - Rut</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f4efe6;
    margin: 0;
    padding: 20px;
    color: #333;
}

.container {
    max-width: 600px;
    margin: auto;
    background: white;
    padding: 25px;
    border-radius: 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
}

h1 {
    text-align: center;
    color: #704214;
}

h2, h3 {
    text-align: center;
}

button {
    display: block;
    width: 100%;
    padding: 14px;
    margin: 10px 0;
    border: none;
    border-radius: 10px;
    background: #e8dcc8;
    cursor: pointer;
    font-size: 16px;
}

button:hover {
    background: #d6c3a5;
}

#resultado {
    text-align: center;
}

input {
    width: 90%;
    padding: 14px;
    margin: 15px 0;
    border: 1px solid #ccc;
    border-radius: 10px;
    font-size: 16px;
}

.primer-lugar {
    font-size: 22px;
    font-weight: bold;
}
</style>
</head>

<body>

<div class="container">

<div id="inicio">

<h1>📖 QUIZ BÍBLICO: RUT</h1>

<h3>👥 Competencia por equipos</h3>

<p style="text-align:center;">
Escribe el nombre de tu equipo para comenzar.
</p>

<input type="text" id="nombreEquipo" placeholder="Nombre del equipo">

<button onclick="comenzarQuiz()">
🚀 Comenzar Quiz
</button>

</div>

<div id="quiz" style="display:none;"></div>

<div id="resultado" style="display:none;"></div>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    set,
    onValue
} from
"https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";


const firebaseConfig = {

apiKey: "AIzaSyDKZZobSUGwY8j_6btwH4YifDsZgPTh-ms",

authDomain: "quiz-biblico-rut-1281f.firebaseapp.com",

databaseURL: "https://quiz-biblico-rut-1281f-default-rtdb.firebaseio.com",

projectId: "quiz-biblico-rut-1281f",

storageBucket: "quiz-biblico-rut-1281f.firebasestorage.app",

messagingSenderId: "379404224053",

appId: "1:379404224053:web:e9c9439d62f3898197937c"

};


const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


const preguntas = [

{
pregunta: "¿Por qué salió la familia de Noemí de Belén hacia Moab?",
opciones: ["Por hambre", "Por guerra", "Por una enfermedad"],
correcta: 0
},

{
pregunta: "¿De dónde era Rut?",
opciones: ["Egipto", "Moab", "Filistea"],
correcta: 1
},

{
pregunta: "¿Cómo se llamaba el esposo de Noemí?",
opciones: ["Booz", "Obed", "Elimelec"],
correcta: 2
},

{
pregunta: "¿Qué estaba cosechando Rut cuando Booz la conoció?",
opciones: ["Trigo", "Cebada", "Uvas"],
correcta: 1
},

{
pregunta: "¿Qué relación tenía Rut con Noemí?",
opciones: ["Hermana", "Hija", "Nuera"],
correcta: 2
},

{
pregunta: "¿Qué hizo Rut a medianoche en la era por consejo de Noemí?",
opciones: [
"Se escondió en la era",
"Se acostó a los pies de Booz",
"Regresó a Moab"
],
correcta: 1
},

{
pregunta: "¿Quién tenía el derecho de redimir antes que Booz?",
opciones: [
"El hermano de Noemí",
"El hijo de Rut",
"Otro pariente más cercano"
],
correcta: 2
},

{
pregunta: "¿Qué objeto se quitaba como señal en la transacción de redención?",
opciones: ["Un anillo", "Una sandalia", "Un manto"],
correcta: 1
},

{
pregunta: "¿Quién fue la madre de Booz?",
opciones: ["Noemí", "Rut", "Rahab"],
correcta: 2
},

{
pregunta: "MODO RABINO 🧠: ¿Cuál es la línea de descendencia correcta hasta David?",
opciones: [
"Rut → Booz → Obed → Isaí → David",
"Rut → Obed → Booz → Isaí → David",
"Booz → Rut → Isaí → Obed → David"
],
correcta: 0
}

];


let preguntaActual = 0;
let puntuacion = 0;
let nombreEquipo = "";


window.comenzarQuiz = function() {

nombreEquipo =
document.getElementById("nombreEquipo").value.trim();

if (nombreEquipo === "") {

alert("⚠️ Escribe primero el nombre del equipo.");

return;

}

document.getElementById("inicio").style.display = "none";

document.getElementById("quiz").style.display = "block";

mostrarPregunta();

};


function mostrarPregunta() {

const p = preguntas[preguntaActual];

const quiz = document.getElementById("quiz");

quiz.innerHTML = `

<h2>Pregunta ${preguntaActual + 1} de ${preguntas.length}</h2>

<h3>${p.pregunta}</h3>

${p.opciones.map((opcion, indice) => `

<button onclick="responder(${indice})">
${opcion}
</button>

`).join("")}

`;

}


window.responder = function(indice) {

const p = preguntas[preguntaActual];

if (indice === p.correcta) {

puntuacion += 10;

alert("✅ ¡Correcto! +10 puntos");

} else {

alert("❌ Incorrecto");

}

preguntaActual++;

if (preguntaActual < preguntas.length) {

mostrarPregunta();

} else {

guardarResultado();

}

};


function guardarResultado() {

const resultadosRef = ref(db, "resultados");

const nuevoResultado = push(resultadosRef);

set(nuevoResultado, {

equipo: nombreEquipo,

puntuacion: puntuacion,

fecha: Date.now()

})
.then(() => {

mostrarResultado();

})
.catch((error) => {

alert("Error al guardar el resultado: " + error.message);

});

}


function mostrarResultado() {

document.getElementById("quiz").style.display = "none";

const resultado =
document.getElementById("resultado");

resultado.style.display = "block";

resultado.innerHTML = `

<h1>🎉 ¡Quiz terminado!</h1>

<h2>${nombreEquipo}</h2>

<h2>🏆 ${puntuacion} / 100 puntos</h2>

<p>Tu resultado ha sido guardado.</p>

<hr>

<h2>🏆 CLASIFICACIÓN</h2>

<div id="clasificacion">
Cargando clasificación...
</div>

`;

mostrarClasificacion();

}


function mostrarClasificacion() {

const resultadosRef = ref(db, "resultados");

onValue(resultadosRef, (snapshot) => {

const datos = snapshot.val();

if (!datos) {

document.getElementById("clasificacion").innerHTML =
"No hay resultados todavía.";

return;

}

const equipos = Object.values(datos);

equipos.sort((a, b) =>
b.puntuacion - a.puntuacion
);

let html = "";

equipos.forEach((equipo, indice) => {

let posicion = indice + 1;

let emoji = "";

if (posicion === 1) emoji = "🥇";
if (posicion === 2) emoji = "🥈";
if (posicion === 3) emoji = "🥉";

html += `

<p class="${posicion === 1 ? "primer-lugar" : ""}">

${emoji} ${posicion}. 
${equipo.equipo} — 
${equipo.puntuacion} puntos

</p>

`;

});

document.getElementById("clasificacion").innerHTML = html;

});

}

</script>

</body>
</html>
